<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>The agent harness</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(1000px,100% - 32px);margin:64px auto 96px}

.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}
`;
// The live half of the bench.
//
// Nothing here invents a number: every value it shows comes from DATA, which
// came from harness.mjs. The parts that move are moved because the model says
// they should move.

const DATA = {"W":1000,"H":720,"tools":[{"id":"read_file","label":"read file","mcp":false,"result":312,"latency":0.21,"cost":0.0002},{"id":"search","label":"search","mcp":false,"result":1240,"latency":0.74,"cost":0.0011},{"id":"shell","label":"shell","mcp":false,"result":486,"latency":1.36,"cost":0.0008},{"id":"http","label":"http","mcp":false,"result":903,"latency":0.92,"cost":0.0014},{"id":"fs","label":"filesystem","mcp":true,"result":288,"latency":0.44,"cost":0.0003},{"id":"db","label":"database","mcp":true,"result":1547,"latency":1.71,"cost":0.0019}],"turn":{"prompt":1240,"system":412,"history":534,"user":294,"answer":386,"temperature":0.7,"maxTokens":4096,"latency":1.84,"cost":0.012},"stages":[{"id":"assemble","name":"assemble context","detail":"system prompt + history + user message"},{"id":"call","name":"call model","detail":"one request, temperature 0.7"},{"id":"tools","name":"run tool","detail":"the model asked for a tool"},{"id":"observe","name":"observe result","detail":"the tool's output goes back in"},{"id":"answer","name":"stream answer","detail":"tokens out to the person"}],"permission":{"default":"ask","modes":["ask","allow","deny"],"note":{"ask":"asks before every tool","allow":"runs tools without asking","deny":"no tools at all"}},"memory":{"files":3,"bytes":48213,"pulled":612},"user":{"channel":"terminal","streams":true,"chars":1612,"waited":1.84},"limits":{"contextLimit":128000,"maxTurns":24,"spentTurns":7,"hardStop":"context full, or the turn limit"},"contextLimit":128000,"jacks":[{"id":"read_file","z":16},{"id":"search","z":25},{"id":"shell","z":34},{"id":"http","z":43},{"id":"fs","z":52},{"id":"db","z":61}],"plugBase":16,"gauges":{"tokens":{"centre":[568.5771991607628,439.69211527687906],"up":[0,-1],"right":[-0.9995928881201541,-0.028531702010381774],"length":8.994392036381488},"latency":{"centre":[582.6732015336119,450.78837276633635],"up":[0,-1],"right":[-0.9995928881201539,-0.028531702010384234],"length":6.938530999494287},"cost":{"centre":[551.4988028214739,450.6371049874441],"up":[0,-1],"right":[-0.9995928881201539,-0.028531702010383922],"length":6.938530999494287}},"beltPath":[[497.2781303580447,457.4397174117678],[496.05573977601847,457.79902068650847],[494.4157437107621,457.8869223613433],[492.3862029496449,457.701918414245],[490.00184349778453,457.2471743140411],[487.30346240647174,456.53047085836505],[484.33722972431144,455.5640710420512],[481.15389851489044,454.36451023389327],[477.8079364577881,452.9523132518999],[474.3565938914774,451.3516431779681],[470.85892424416085,449.5898879208524],[467.37477361324125,447.6971916014528],[463.9637567820026,445.70593877854884],[460.6842371941401,443.65020034002],[457.59232833905656,441.56515054050783],[454.74093363450163,439.48646516016703],[452.1788412344261,437.4497110821758],[449.9498892501416,435.48973773350326],[448.0922156680814,433.6400808015527],[446.63760579827897,431.93238842925143],[445.6109484189007,430.39587970655134],[445.029809922351,429.05684472369853],[444.9041337494278,427.93819474050025],[445.2360702542938,427.0590701683174],[446.01993991132065,426.4345130723194],[447.2423304933468,426.07520979757874],[448.8823265586032,425.98730812274385],[450.91186731972044,426.1723120698422],[453.2962267715808,426.6270561700461],[455.99460786289353,427.3437596257221],[458.9608405450538,428.310159442036],[462.1441717544748,429.509720250194],[465.49013381157715,430.9219172321873],[468.94147637788785,432.5225873061191],[472.4391460252045,434.2843425632348],[475.9232966561241,436.1770388826344],[479.3343134873627,438.16829170553837],[482.61383307522516,440.2240301440672],[485.7057419303087,442.3090799435794],[488.5571366348637,444.3877653239201],[491.11922903493917,446.4245194019115],[493.34818101922366,448.38449275058395],[495.20585460128393,450.2341496825345],[496.6604644710863,451.9418420548358],[497.68712185046456,453.47835077753587],[498.2682603470143,454.8173857603887],[498.39393651993754,455.93603574358696],[498.0620000150715,456.8151603157698],[497.2781303580447,457.4397174117678]],"beltHome":[[477.8079364577881,451.66740010384547],[463.9637567820026,444.42102563049434],[452.1788412344261,436.1647979341212]],"drumStack":2,"tour":[{"stage":0,"hold":2.2},{"stage":1,"hold":2.6},{"stage":2,"hold":2.4},{"stage":3,"hold":2.2},{"stage":4,"hold":3}],"ez":[0,-1.606141435068139]};
const stage = document.querySelector(".iso-stage");
const svg = document.querySelector(".iso-svg");
if (stage && svg) {
  const readout = document.querySelector("[data-readout]");
  const units = new Intl.NumberFormat("en-US");
  const clamp = (value, low, high) => Math.min(high, Math.max(low, value));
  const lerp = (a, b, t) => a + (b - a) * t;

  const state = {
    stage: 0,
    tool: 0,
    permission: 0, // ask: the harness waits for the person
    memory: false,
    turn: 1,
  };

  const plug = [...svg.querySelectorAll('[data-group="plug"]')];
  const jackHits = [...svg.querySelectorAll("[data-jack]")];
  const keyHits = [...svg.querySelectorAll('[data-key="permission"]')];
  const drawerHits = [...svg.querySelectorAll("[data-drawer]")];
  const needles = Object.fromEntries(
    [...svg.querySelectorAll("[data-needle]")].map((node) => [node.getAttribute("data-needle"), node]),
  );
  const beltCards = [...svg.querySelectorAll('[data-group^="beltcard"]')];
  const drumCards = [...svg.querySelectorAll('[data-group^="drumcard"]')];
  const glow = svg.querySelector('[data-glow="core"]');
  const gateBar = svg.querySelector('[data-group="gatebar"]');
  const mcpLeds = [...svg.querySelectorAll("[data-mcp-led]")];
  const MCP_TOOLS = DATA.tools.map((tool, index) => (tool.mcp ? index : -1)).filter((index) => index >= 0);

  const tool = () => DATA.tools[state.tool];
  const contextUsed = () =>
    DATA.turn.prompt + tool().result + DATA.turn.answer + (state.memory ? DATA.memory.pulled : 0);
  const contextPercent = () => (contextUsed() / DATA.contextLimit) * 100;

  const describe = () => {
    const stageInfo = DATA.stages[state.stage];
    const bits = [
      `turn ${state.turn}`,
      stageInfo.name,
      `${tool().label}${tool().mcp ? " (mcp)" : ""} · ${units.format(tool().result)} tok`,
      `${units.format(contextUsed())} tok · ${contextPercent().toFixed(2)}% of ${units.format(DATA.contextLimit / 1000)}k`,
      DATA.permission.modes[state.permission],
    ];
    return bits.join(" · ");
  };

  // The plug travels between jacks; the jack it sits in decides the tool.
  let plugDz = 0;
  let plugGoal = 0;
  const plugAt = (dz) => {
    for (const node of plug) {
      node.dataset.dz = String(dz);
      node.setAttribute("transform", `translate(${(dz * DATA.ez[0]).toFixed(2)} ${(dz * DATA.ez[1]).toFixed(2)})`);
    }
  };
  const movePlug = (immediate) => {
    const dz = DATA.jacks[state.tool].z - DATA.plugBase;
    plugGoal = dz;
    if (immediate) {
      plugDz = dz;
      plugAt(dz);
    }
  };

  const setNeedle = (id, share) => {
    const node = needles[id];
    if (!node) return;
    const gauge = DATA.gauges[id];
    const angle = (share - 0.5) * 2.5; // most of the dial, swinging both ways
    const dir = [
      Math.sin(angle) * gauge.right[0] + Math.cos(angle) * gauge.up[0],
      Math.sin(angle) * gauge.right[1] + Math.cos(angle) * gauge.up[1],
    ];
    const length = Math.hypot(dir[0], dir[1]) || 1;
    const tip = [gauge.centre[0] + (dir[0] / length) * gauge.length, gauge.centre[1] + (dir[1] / length) * gauge.length];
    node.setAttribute("d", `M${gauge.centre[0].toFixed(2)} ${gauge.centre[1].toFixed(2)}L${tip[0].toFixed(2)} ${tip[1].toFixed(2)}`);
  };

  const setCards = (share) => {
    // The cards ride the belt; the drum's stack grows with the context.
    const path = DATA.beltPath;
    for (let index = 0; index < beltCards.length; index++) {
      const at = ((share + index / beltCards.length) % 1) * (path.length - 1);
      const i = Math.floor(at);
      const j = Math.min(path.length - 1, i + 1);
      const f = at - i;
      const home = DATA.beltHome[index];
      const x = lerp(path[i][0], path[j][0], f) - home[0];
      const y = lerp(path[i][1], path[j][1], f) - home[1];
      beltCards[index].setAttribute("transform", `translate(${x.toFixed(2)} ${y.toFixed(2)})`);
    }
    const stack = state.memory ? 3 : DATA.drumStack;
    for (let index = 0; index < drumCards.length; index++) {
      const dz = index < stack ? 0 : -6;
      drumCards[index].setAttribute("transform", `translate(${(dz * DATA.ez[0]).toFixed(2)} ${(dz * DATA.ez[1]).toFixed(2)})`);
    }
  };

  const refresh = () => {
    const toolInfo = tool();
    if (readout) readout.textContent = describe();
    stage.setAttribute("aria-description", describe());
    setNeedle("tokens", clamp(contextUsed() / DATA.turn.maxTokens, 0, 1));
    setNeedle("latency", clamp((toolInfo.latency + 0.1) / 3, 0, 1));
    setNeedle("cost", clamp((toolInfo.cost + 0.0002) / 0.05, 0, 1));
    if (glow) glow.classList.toggle("is-live", state.stage === 1 || state.stage === 3);
    document.querySelectorAll("[data-jack]").forEach((node) => {
      node.classList.toggle("is-picked", node.getAttribute("data-jack") === String(state.tool));
    });
    document.querySelectorAll('[data-key="permission"]').forEach((node) => {
      node.classList.toggle("is-open", state.permission === 1);
    });
    if (gateBar) {
      const lift = state.permission === 1 ? 9 : 0;
      gateBar.setAttribute("transform", `translate(${(lift * DATA.ez[0]).toFixed(2)} ${(lift * DATA.ez[1]).toFixed(2)})`);
    }
    const mcpIndex = MCP_TOOLS.indexOf(state.tool);
    mcpLeds.forEach((node, index) => {
      node.classList.toggle("is-live", index === mcpIndex);
    });
  };

  // Every control answers the mouse and the keyboard the same way.
  const pressable = (node, action) => {
    node.addEventListener("click", action);
    node.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " " || event.key === "Spacebar") {
        event.preventDefault();
        action();
      }
    });
  };

  jackHits.forEach((node) => {
    pressable(node, () => {
      touring = false;
      state.tool = Number(node.getAttribute("data-jack"));
      movePlug(false);
      refresh();
    });
  });
  keyHits.forEach((node) => {
    pressable(node, () => {
      touring = false;
      state.permission = (state.permission + 1) % DATA.permission.modes.length;
      refresh();
    });
  });
  drawerHits.forEach((node) => {
    pressable(node, () => {
      touring = false;
      state.memory = !state.memory;
      refresh();
    });
  });

  stage.addEventListener("keydown", (event) => {
    touring = false;
    if (event.key === "ArrowRight" || event.key === "ArrowDown") {
      state.stage = (state.stage + 1) % DATA.stages.length;
      if (state.stage === 0) state.turn += 1;
    }
    else if (event.key === "ArrowLeft" || event.key === "ArrowUp") state.stage = (state.stage + DATA.stages.length - 1) % DATA.stages.length;
    else if (event.key === "t" || event.key === "T") state.tool = (state.tool + 1) % DATA.tools.length;
    else if (event.key === "p" || event.key === "P") state.permission = (state.permission + 1) % DATA.permission.modes.length;
    else if (event.key === "m" || event.key === "M") state.memory = !state.memory;
    else return;
    event.preventDefault();
    movePlug(false);
    refresh();
  });

  // The idle tour: one turn of the loop, walking the stages on its own.
  let clock = 0;
  let last = 0;
  let frame = 0;
  let touring = true;
  const tour = DATA.tour;
  const tourAt = (time) => {
    let spent = 0;
    for (let index = 0; index < tour.length; index++) {
      if (time < spent + tour[index].hold) return { stage: tour[index].stage, share: (time - spent) / tour[index].hold };
      spent += tour[index].hold;
    }
    return { stage: tour[tour.length - 1].stage, share: 1 };
  };

  const tick = (now) => {
    const dt = last ? Math.min((now - last) / 1000, 1 / 20) : 1 / 60;
    last = now;
    if (Math.abs(plugDz - plugGoal) > 0.05) {
      plugDz += (plugGoal - plugDz) * Math.min(1, dt * 7);
      plugAt(plugDz);
    }
    if (touring) {
      clock += dt;
      const at = tourAt(clock);
      if (at.stage !== state.stage) {
        state.stage = at.stage;
        refresh();
      }
      setCards(at.share);
    }
    frame = requestAnimationFrame(tick);
  };
  frame = requestAnimationFrame(tick);

  stage.addEventListener("pointerdown", () => {
    touring = false;
  });

  movePlug(true);
  refresh();
  setCards(0);
}
</script></body></html>
